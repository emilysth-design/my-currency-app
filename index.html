<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Exchange App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-12">

    <!-- Header Section -->
    <header class="bg-indigo-600 text-white py-8 px-4 shadow-lg mb-8">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold flex items-center gap-3">
                    <i class="fa-solid me-1 fa-coins text-yellow-300"></i>
                    Currency Exchange
                </h1>
                <p class="text-indigo-200 text-sm mt-1">แปลงอัตราแลกเปลี่ยนและเปรียบเทียบค่าเงินเรียลไทม์ (รองรับ THB)</p>
            </div>
            <div id="statusBadge" class="hidden sm:flex items-center gap-2 bg-indigo-700/60 text-xs px-3 py-1.5 rounded-full border border-indigo-400/30">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>API เชื่อมต่อปกติ</span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 space-y-8">
        <!-- Main Converter Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 sm:p-8">
            <h2 class="text-lg font-semibold text-slate-700 mb-6 flex items-center gap-2">
                <i class="fa-solid fa-calculator text-indigo-500"></i> คำนวณแปลงสกุลเงิน
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                <!-- Amount Input -->
                <div class="md:col-span-5">
                    <label class="block text-xs font-medium text-slate-500 mb-1">จำนวนเงิน</label>
                    <div class="relative">
                        <input type="number" id="amountInput" value="100" min="0" step="any"
                            class="w-full pl-4 pr-10 py-3 text-lg font-bold text-slate-800 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none transition-all">
                        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">
                            <i class="fa-solid fa-wallet"></i>
                        </span>
                    </div>
                </div>

                <!-- From Currency -->
                <div class="md:col-span-3">
                    <label class="block text-xs font-medium text-slate-500 mb-1">สกุลเงินต้นทาง</label>
                    <select id="fromCurrency" class="w-full px-3 py-3 font-semibold text-slate-700 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none cursor-pointer">
                        <option value="THB" selected>THB - บาทไทย</option>
                        <option value="USD">USD - ดอลลาร์สหรัฐ</option>
                        <option value="EUR">EUR - ยูโร</option>
                        <option value="JPY">JPY - เยนญี่ปุ่น</option>
                        <option value="GBP">GBP - ปอนด์สเตอลิง</option>
                        <option value="CNY">CNY - หยวนจีน</option>
                        <option value="KRW">KRW - วอนเกาหลีใต้</option>

                        <option value="SGD">SGD - ดอลลาร์สิงคโปร์</option>
                    </select>
                </div>

                <!-- Swap Button -->
                <div class="md:col-span-1 flex justify-center py-2 md:py-0">
                    <button id="swapBtn" class="p-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-full transition-transform active:scale-95 shadow-sm border border-indigo-100">
                        <i class="fa-solid fa-arrow-right-arrow-left text-base"></i>
                    </button>
                </div>

                <!-- To Currency -->
                <div class="md:col-span-3">
                    <label class="block text-xs font-medium text-slate-500 mb-1">สกุลเงินปลายทาง</label>
                    <select id="toCurrency" class="w-full px-3 py-3 font-semibold text-slate-700 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none cursor-pointer">
                        <option value="USD" selected>USD - ดอลลาร์สหรัฐ</option>
                        <option value="THB">THB - บาทไทย</option>
                        <option value="EUR">EUR - ยูโร</option>
                        <option value="JPY">JPY - เยนญี่ปุ่น</option>
                        <option value="GBP">GBP - ปอนด์สเตอลิง</option>
                        <option value="CNY">CNY - หยวนจีน</option>
                        <option value="KRW">KRW - วอนเกาหลีใต้</option>
                        <option value="SGD">SGD - ดอลลาร์สิงคโปร์</option>
                    </select>
                </div>
            </div>

            <!-- Result Box -->
            <div class="mt-8 bg-gradient-to-br from-indigo-500 to-indigo-700 rounded-2xl p-6 text-white shadow-inner flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <div class="text-indigo-200 text-xs font-medium mb-1" id="conversionFormula">100 THB =</div>
                    <div class="text-3xl sm:text-4xl font-extrabold tracking-tight" id="resultText">--</div>
                </div>
                <div class="bg-white/10 backdrop-blur-md px-4 py-2 rounded-xl text-xs text-indigo-100 border border-white/10" id="rateInfo">
                    อัตราแลกเปลี่ยน: Loading...
                </div>
            </div>
        </div>

        <!-- Comparison Table Section -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 sm:p-8">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-6">
                <div>
                    <h2 class="text-lg font-semibold text-slate-700 flex items-center gap-2">
                        <i class="fa-solid fa-globe text-indigo-500"></i> เปรียบเทียบกับสกุลเงินยอดนิยม
                    </h2>
                    <p class="text-xs text-slate-400">เปรียบเทียบมูลค่า ณ เวลาปัจจุบัน</p>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 text-xs text-slate-400 uppercase font-semibold">
                            <th class="py-3 px-4">สกุลเงิน</th>
                            <th class="py-3 px-4">อัตราแลกเปลี่ยน (1 หน่วย)</th>
                            <th class="py-3 px-4 text-right">จำนวนที่ได้</th>
                        </tr>
                    </thead>
                    <tbody id="comparisonTable" class="divide-y divide-slate-100 text-sm">
                        <!-- Dynamic content by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const amountInput = document.getElementById('amountInput');
        const fromCurrency = document.getElementById('fromCurrency');
        const toCurrency = document.getElementById('toCurrency');
        const swapBtn = document.getElementById('swapBtn');
        const resultText = document.getElementById('resultText');
        const conversionFormula = document.getElementById('conversionFormula');
        const rateInfo = document.getElementById('rateInfo');
        const comparisonTable = document.getElementById('comparisonTable');

        const popularCurrencies = [
            { code: 'USD', name: 'ดอลลาร์สหรัฐ' },
            { code: 'THB', name: 'บาทไทย' },
            { code: 'EUR', name: 'ยูโร' },
            { code: 'JPY', name: 'เยนญี่ปุ่น' },
            { code: 'GBP', name: 'ปอนด์สเตอลิง' },
            { code: 'CNY', name: 'หยวนจีน' },
            { code: 'KRW', name: 'วอนเกาหลีใต้' },
            { code: 'SGD', name: 'ดอลลาร์สิงคโปร์' }
        ];

        let cachedRates = {};
        let currentBase = '';

        async function fetchExchangeRates(base) {
            try {
                const response = await fetch(`https://open.er-api.com/v6/latest/${base}`);
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                if (data.result === "error") throw new Error(data['error-type']);
                
                cachedRates = data.rates;
                currentBase = base;
                return data.rates;
            } catch (error) {
                console.error("Fetch error:", error);
                return null;
            }
        }

        async function updateConversion() {
            const amount = parseFloat(amountInput.value) || 0;
            const from = fromCurrency.value;
            const to = toCurrency.value;

            if (from !== currentBase || Object.keys(cachedRates).length === 0) {
                resultText.innerText = "กำลังคำนวณ...";
                const rates = await fetchExchangeRates(from);
                if (!rates) {
                    resultText.innerText = "Error";
                    rateInfo.innerText = "เกิดข้อผิดพลาดในการดึงข้อมูล";
                    return;
                }
            }

            const rate = cachedRates[to];
            if (rate) {
                const converted = (amount * rate).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
                resultText.innerText = `${converted} ${to}`;
                conversionFormula.innerText = `${amount.toLocaleString('th-TH')} ${from} =`;
                rateInfo.innerText = `1 ${from} = ${rate.toFixed(4)} ${to}`;
            } else {
                resultText.innerText = "N/A";
            }

            renderComparisonTable(amount, from);
        }

        function renderComparisonTable(amount, base) {
            comparisonTable.innerHTML = '';
            popularCurrencies.forEach(curr => {
                if (curr.code === base) return;
                const rate = cachedRates[curr.code];
                if (rate) {
                    const total = (amount * rate).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-50/80 transition-colors';
                    tr.innerHTML = `
                        <td class="py-3 px-4 font-semibold text-slate-700">
                            ${curr.code} <span class="text-xs text-slate-400 font-normal">(${curr.name})</span>
                        </td>
                        <td class="py-3 px-4 text-slate-500">1 ${base} = ${rate.toFixed(4)} ${curr.code}</td>
                        <td class="py-3 px-4 text-right font-bold text-indigo-600">${total} ${curr.code}</td>
                    `;
                    comparisonTable.appendChild(tr);
                }
            });
        }

        // Event Listeners
        amountInput.addEventListener('input', updateConversion);
        fromCurrency.addEventListener('change', updateConversion);
        toCurrency.addEventListener('change', updateConversion);

        swapBtn.addEventListener('click', () => {
            const temp = fromCurrency.value;
            fromCurrency.value = toCurrency.value;
            toCurrency.value = temp;
            updateConversion();
        });

        // Initial Load
        updateConversion();
    </script>
</body>
</html>
